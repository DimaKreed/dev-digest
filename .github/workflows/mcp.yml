# mcp suite — the local stdio MCP server (@devdigest/mcp).
# Five tools over the DevDigest HTTP API. Tests are hermetic: the API is a
# hand-written fake behind the DevDigestApi port and time is a fake clock, so
# there is no server, no Postgres and no Docker in this lane. Uses npm
# (package-lock.json), like reviewer-core and e2e.
#
# The path filter is mcp/** and this file, and nothing else. Unlike
# reviewer-core, this package shares NO source with server/: it declares its own
# narrow response schemas rather than aliasing @devdigest/shared, so a contract
# edit under server/src/vendor/shared/** cannot affect this type-check.
# Symmetrically, no other workflow triggers on mcp/**.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
